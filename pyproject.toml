[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moonlark-qsandbox"
version = "0.1.0"
description = "MQS — a faithful, agent-first sandbox for the QQ Bot API v2"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Moonlark Dev Team" }]
keywords = ["qqbot", "sandbox", "moonlark", "fastapi", "mcp"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "typer>=0.15",
    "pyyaml>=6.0",
    "mcp>=2.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]
build = ["pyinstaller>=6"]
desktop = ["pyinstaller>=6"]

[project.scripts]
mqs = "mqs.cli:main"

[project.urls]
Homepage = "https://github.com/Moonlark-Dev/qsandbox"

[tool.hatch.build.targets.wheel]
packages = ["src/mqs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
markers = [
    "sdk: requires a real QQ SDK / external process",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency defaults are the intended idiom here
"src/mqs/api/sim.py" = ["B008"]
