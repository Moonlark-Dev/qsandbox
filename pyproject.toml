[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moonlark-qsandbox"
version = "0.1.0"
description = "MQS — a faithful, agent-first sandbox for the QQ Bot API v2"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Moonlark Dev Team" }]
keywords = ["qqbot", "sandbox", "moonlark", "fastapi", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "typer>=0.15",
    "pyyaml>=6.0",
    "mcp>=2.0",
    "python-multipart>=0.0.9",
    # Windows (and slim containers) ship no IANA zoneinfo database, and
    # mqs.clock resolves ZoneInfo("Asia/Shanghai") at import time.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]
build = [
    "nuitka[onefile]>=2.5",
    # Nuitka standalone builds on Linux need patchelf to fix rpaths.
    "patchelf>=0.17; sys_platform == 'linux'",
]
desktop = [
    "nuitka[onefile]>=2.5",
    "patchelf>=0.17; sys_platform == 'linux'",
]

[project.scripts]
mqs = "mqs.cli:main"

[project.urls]
Homepage = "https://github.com/Moonlark-Dev/qsandbox"
Repository = "https://github.com/Moonlark-Dev/qsandbox"
Issues = "https://github.com/Moonlark-Dev/qsandbox/issues"
Releases = "https://github.com/Moonlark-Dev/qsandbox/releases"

[tool.hatch.build]
# `web/dist` is gitignored because it is generated, but it is part of the
# product: a `pip install` must serve the same GUI the desktop sidecar serves.
# Release CI builds the frontend before `python -m build`, and
# tools/smoke_wheel.py fails the build if it did not make it into the wheel.
artifacts = ["web/dist/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/mqs"]

[tool.hatch.build.targets.wheel.force-include]
"web/dist" = "mqs/web/dist"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
markers = [
    "sdk: requires a real QQ SDK / external process",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency defaults are the intended idiom here
"src/mqs/api/sim.py" = ["B008"]
