[workspace]
members = ["crates/mqs", "desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["Moonlark Dev Team"]
repository = "https://github.com/Moonlark-Dev/qsandbox"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

# Debug builds are for tests and local runs: skip debuginfo to keep the artifacts
# (and the CI/disk footprint) small.
[profile.dev]
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
