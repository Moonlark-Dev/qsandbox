name: passive_window
description: 自定义 5 分钟被动窗口（默认群窗口 60 分钟）：快进 6 分钟后回复应返回 40057
setup:
  settings:
    rate_mode: "off"
    require_online: false
    passive_window_group_ms: 300000
    passive_reply_limit_group: 5
  bots:
    - app_id: "10001"
      name: MQS Offline Bot
      scopes: [group_message, c2c_message, media]
  users:
    - alias: alice
      name: 窗口测试用户
  groups:
    - alias: room
      name: 窗口测试群
      owner: alice
      members: [alice]
      bots: ["10001"]
steps:
  - send:
      as: alice
      to: room
      text: window-ping
      at_bots: ["10001"]
  - advance: 6m
  - http:
      bot: "10001"
      method: POST
      target: group
      group: room
      path: /v2/groups/{openid}/messages
      json:
        content: too-late
        msg_id: "{{incoming_msg_id}}"
      expect_status: 400
      expect_code: 40057
