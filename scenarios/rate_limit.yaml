name: rate_limit
description: 未认证个人 · 单聊主动消息 5/qps：第 6 条应 429（官方频率政策）
setup:
  settings:
    rate_mode: "unverified"
    require_online: false
  bots:
    - app_id: "10001"
      name: MQS Offline Bot
      scopes: [group_message, c2c_message, media]
  users:
    - alias: alice
      name: 限流测试用户
steps:
  - http:
      bot: "10001"
      method: POST
      target: user
      user: alice
      path: /v2/users/{openid}/messages
      json: {content: active-1}
      expect_status: 200
  - http:
      bot: "10001"
      method: POST
      target: user
      user: alice
      path: /v2/users/{openid}/messages
      json: {content: active-2}
      expect_status: 200
  - http:
      bot: "10001"
      method: POST
      target: user
      user: alice
      path: /v2/users/{openid}/messages
      json: {content: active-3}
      expect_status: 200
  - http:
      bot: "10001"
      method: POST
      target: user
      user: alice
      path: /v2/users/{openid}/messages
      json: {content: active-4}
      expect_status: 200
  - http:
      bot: "10001"
      method: POST
      target: user
      user: alice
      path: /v2/users/{openid}/messages
      json: {content: active-5}
      expect_status: 200
  - http:
      bot: "10001"
      method: POST
      target: user
      user: alice
      path: /v2/users/{openid}/messages
      json: {content: active-6}
      expect_status: 429
      expect_code: 42900
