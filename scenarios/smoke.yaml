name: smoke
description: 群聊冒烟：用户发言 -> Bot 收到事件 -> Bot 被动回复（需要被测 Bot 已连接网关并实现 echo）
setup:
  settings:
    rate_mode: "off"
    require_online: true
  bots:
    - app_id: "10000"
      name: MQS Echo Bot
      scopes: [group_message, c2c_message, media, member]
  users:
    - alias: alice
      name: 测试用户甲
  groups:
    - alias: room
      name: 冒烟测试群
      owner: alice
      members: [alice]
      bots: ["10000"]
steps:
  - send:
      as: alice
      to: room
      text: ping
      at_bots: ["10000"]
  - expect_event:
      type: GROUP_AT_MESSAGE_CREATE
      conversation: "group:{{room}}"
      content_contains: ping
      timeout: 3s
  - expect_message:
      conversation: "group:{{room}}"
      direction: out
      content_contains: ping
      timeout: 15s
