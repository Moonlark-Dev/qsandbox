name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Everything CI checks runs again for the tagged commit: the installer that
  # gets published is produced by exactly the steps CI verified.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Only the bundles and the CLI archive: `web-dist` is an input to the
      # builds, not something to publish. Each desktop artifact keeps the
      # bundler's own layout (`appimage/`, `deb/`, `msi/`, …).
      - uses: actions/download-artifact@v4
        with:
          pattern: qsandbox-*
          path: dist
          merge-multiple: true
      - name: Read the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="${GITHUB_REF_NAME#v}"
          test "$version" = "$tag" || { echo "tag $tag does not match Cargo.toml $version"; exit 1; }
      - name: List release files
        run: find dist -type f | sort
      # The upload action does not recurse by itself, and each desktop artifact
      # keeps the bundler's layout (`appimage/`, `deb/`, `msi/`, …). Flatten the
      # bundles into one directory, and fail here — not with a vague glob error —
      # when a platform silently produced nothing.
      - name: Stage release assets
        run: |
          mkdir -p out
          find dist -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
            -o -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name 'mqs-linux-x64.tar.gz' \) \
            -exec cp -v {} out/ \;
          for ext in AppImage deb rpm msi exe dmg; do
            ls out/*."$ext" > /dev/null || { echo "no .$ext bundle was produced"; exit 1; }
          done
          test -f out/mqs-linux-x64.tar.gz
          ls -lh out
      - name: Upload artifacts to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          fail_on_unmatched_files: true
          generate_release_notes: true
