name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Everything CI checks runs again for the tagged commit: the installer that
  # gets published is produced by exactly the steps CI verified.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Read the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="${GITHUB_REF_NAME#v}"
          test "$version" = "$tag" || { echo "tag $tag does not match Cargo.toml $version"; exit 1; }
      - name: List release files
        run: ls -l dist
      - name: Upload artifacts to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.msi
            dist/*.exe
            dist/*.dmg
            dist/mqs-linux-x64.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
