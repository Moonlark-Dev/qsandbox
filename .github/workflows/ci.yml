name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q
      - name: Contract artifacts are current
        run: |
          mqs contract export --out docs/COVERAGE.md --types web/src/types/api.ts
          git diff --exit-code docs/COVERAGE.md web/src/types/api.ts
      - name: CLI doctor
        run: |
          MQS_HOME=/tmp/mqs-doctor mqs doctor --profile ci || true
          MQS_HOME=/tmp/mqs-doctor mqs status --profile ci || true

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx vue-tsc --noEmit
      - run: npm run build

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build sidecar (Nuitka)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"
          python tools/build_sidecar.py
      - name: Smoke test sidecar
        run: |
          mkdir -p /tmp/mqs-sidecar-home
          MQS_HOME=/tmp/mqs-sidecar-home ./build-sidecar/mqs serve --profile ci --port 5750 --control-port 5751 --token ci-token > /tmp/mqs-sidecar.log 2>&1 &
          pid=$!
          for i in $(seq 1 60); do grep -q '"gui_url"' /tmp/mqs-sidecar.log && break; sleep 0.5; done
          grep -q '"gui_url"' /tmp/mqs-sidecar.log
          kill "$pid" || true
          wait "$pid" || true
      - uses: actions/upload-artifact@v4
        with:
          name: qsandbox-sidecar-linux
          path: build-sidecar/mqs
          if-no-files-found: error

  botpy-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" qq-botpy
      - name: Start sandbox
        run: |
          mkdir -p /tmp/mqs-home
          MQS_HOME=/tmp/mqs-home mqs serve --profile ci --port 5700 --control-port 5701 --token ci-token > /tmp/mqs.log 2>&1 &
          for i in $(seq 1 40); do grep -q '"gui_url"' /tmp/mqs.log && break; sleep 0.5; done
          grep -q '"gui_url"' /tmp/mqs.log
      - name: Run botpy echo bot
        env:
          MQS_BASE_URL: http://127.0.0.1:5700
        run: |
          python examples/botpy_echo/bot.py > /tmp/botpy.log 2>&1 &
          for i in $(seq 1 40); do grep -q "ready as" /tmp/botpy.log && break; sleep 0.5; done
          grep -q "ready as" /tmp/botpy.log
          MQS_HOME=/tmp/mqs-home MQS_PROFILE=ci mqs script run smoke --junit /tmp/junit.xml
          test -s /tmp/junit.xml
