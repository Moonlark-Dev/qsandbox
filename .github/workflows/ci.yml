name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ------------------------------------------------------------------ Rust
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-tests
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -p mqs -- -D warnings
      - name: Test (unit + integration)
        run: cargo test -p mqs
      - name: Contract artifacts are current
        run: |
          cargo run -q -p mqs -- contract export
          git diff --exit-code docs/COVERAGE.md web/src/types/api.ts
      - name: CLI doctor
        run: cargo run -q -p mqs -- --home /tmp/mqs-doctor --profile ci doctor || true

  # ------------------------------------------------------------------ GUI
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx vue-tsc --noEmit
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  # ------------------------------------------------------------------ real SDK
  botpy-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-botpy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build mqs
        run: cargo build -p mqs
      - name: Install botpy + the Python shim
        run: |
          python -m pip install --upgrade pip
          pip install qq-botpy ./python
      - name: Start sandbox
        run: |
          mkdir -p /tmp/mqs-home
          MQS_HOME=/tmp/mqs-home ./target/debug/mqs serve --profile ci --port 5700 --control-port 5701 --token ci-token > /tmp/mqs.log 2>&1 &
          for i in $(seq 1 40); do grep -q '"gui_url"' /tmp/mqs.log && break; sleep 0.5; done
          grep -q '"gui_url"' /tmp/mqs.log
      - name: Run botpy echo bot
        env:
          MQS_BASE_URL: http://127.0.0.1:5700
        run: |
          python examples/botpy_echo/bot.py > /tmp/botpy.log 2>&1 &
          for i in $(seq 1 40); do grep -q "ready as" /tmp/botpy.log && break; sleep 0.5; done
          # Show what the real botpy SDK did, so a failure leaves a trail in the log.
          cat /tmp/botpy.log
          grep -q "ready as" /tmp/botpy.log
          MQS_HOME=/tmp/mqs-home ./target/debug/mqs --profile ci script run smoke --junit /tmp/junit.xml
          test -s /tmp/junit.xml
          grep -o '<testsuite[^>]*' /tmp/junit.xml || true
          MQS_HOME=/tmp/mqs-home ./target/debug/mqs --profile ci status --json
      - name: Tear down the sandbox
        if: always()
        run: |
          pkill -f 'examples/botpy_echo/bot.py' || true
          pkill -f 'mqs serve' || true
          echo "--- sandbox log ---"; tail -40 /tmp/mqs.log || true
          echo "--- botpy log ---"; tail -40 /tmp/botpy.log || true

  # ------------------------------------------------------------------ desktop installers
  desktop:
    needs: [web, rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: tauri-${{ matrix.target }}
      - name: Linux webkit dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Restore the built GUI (embedded into the binary at build time)
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Install the Tauri CLI
        run: npm install -g @tauri-apps/cli@^2
      - name: Build the desktop bundle
        working-directory: desktop/src-tauri
        shell: bash
        env:
          # No signing identities on CI runners.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          # The Linux bundler downloads linuxdeploy/AppRun from the GitHub CDN at bundle
          # time and sometimes gets a 5xx there; the build itself is already done, so retry
          # instead of failing the release on someone else's flaky edge.
          for attempt in 1 2 3; do
            if tauri build; then
              ok=1
              break
            fi
            echo "tauri build failed (attempt ${attempt}/3), retrying in 15s" >&2
            sleep 15
          done
          test "${ok:-0}" = 1
      - name: Verify bundles were produced
        shell: bash
        run: |
          set -e
          found=$(find target/release/bundle -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \) | wc -l)
          echo "bundles: $found"
          find target/release/bundle -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \)
          test "$found" -ge 1
      - uses: actions/upload-artifact@v4
        with:
          name: qsandbox-${{ matrix.target }}
          path: |
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.dmg
          if-no-files-found: error

  # ------------------------------------------------------------------ CLI binary
  cli:
    runs-on: ubuntu-latest
    needs: [web]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-cli
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Build mqs (embedded GUI)
        run: cargo build --release -p mqs
      - name: Smoke test the binary
        run: |
          MQS_HOME=/tmp/mqs-smoke ./target/release/mqs --profile smoke serve --port 0 --control-port 0 > /tmp/smoke.log 2>&1 &
          for i in $(seq 1 40); do grep -q '"gui_url"' /tmp/smoke.log && break; sleep 0.5; done
          grep -q '"gui_url"' /tmp/smoke.log
          export MQS_HOME=/tmp/mqs-smoke
          ./target/release/mqs --profile smoke status --json | grep -q '"coverage"'
          gui_port=$(sed -n 's/.*"control_port": *\([0-9]*\).*/\1/p' /tmp/smoke.log | head -1)
          curl -sSf "http://127.0.0.1:${gui_port}/" | grep -q 'id="app"'
          echo "embedded GUI served on control port ${gui_port}"
      - name: Tear down the smoke sandbox
        if: always()
        run: |
          pkill -f 'mqs --profile smoke serve' || true
          echo "--- smoke log ---"; tail -20 /tmp/smoke.log || true
      - name: Package the CLI
        run: |
          mkdir -p dist
          cp target/release/mqs dist/
          tar -C dist -czf "mqs-linux-x64.tar.gz" mqs
      - uses: actions/upload-artifact@v4
        with:
          name: qsandbox-cli
          path: mqs-linux-x64.tar.gz
          if-no-files-found: error
