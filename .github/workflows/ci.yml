name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q
      - name: Contract artifacts are current
        run: |
          mqs contract export --out /tmp/coverage.md --types /tmp/api.ts
          grep -q "接口覆盖率" /tmp/coverage.md

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx vue-tsc --noEmit
      - run: npm run build

  botpy-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" qq-botpy
      - name: Start sandbox
        run: |
          mkdir -p /tmp/mqs-home
          MQS_HOME=/tmp/mqs-home mqs serve --profile ci --port 5700 --control-port 5701 --token ci-token > /tmp/mqs.log 2>&1 &
          for i in $(seq 1 40); do grep -q '"gui_url"' /tmp/mqs.log && break; sleep 0.5; done
          grep -q '"gui_url"' /tmp/mqs.log
      - name: Run botpy echo bot
        env:
          MQS_BASE_URL: http://127.0.0.1:5700
        run: |
          python examples/botpy_echo/bot.py > /tmp/botpy.log 2>&1 &
          for i in $(seq 1 40); do grep -q "ready as" /tmp/botpy.log && break; sleep 0.5; done
          grep -q "ready as" /tmp/botpy.log
          MQS_HOME=/tmp/mqs-home MQS_PROFILE=ci mqs script run smoke --junit /tmp/junit.xml
          test -s /tmp/junit.xml
