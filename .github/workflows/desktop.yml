name: Desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build sidecar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"
          python tools/build_sidecar.py
      - name: Build desktop
        working-directory: desktop
        run: |
          npm install
          npm run dist:${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: qsandbox-${{ matrix.target }}
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.exe
            desktop/release/*.dmg
