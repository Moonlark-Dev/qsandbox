name: Publish mqs-compat to PyPI

# Only the Python shim is published to PyPI (`pip install mqs-compat`). The
# sandbox itself is a Rust binary and ships as installers/CLI archives through
# release.yml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只构建和校验，不发布到 PyPI"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the tag matches the shim version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' python/pyproject.toml | head -1)
          tag="${GITHUB_REF_NAME#v}"
          test "$version" = "$tag" || { echo "tag $tag does not match python/pyproject.toml $version"; exit 1; }
      - name: Build the wheel and sdist
        working-directory: python
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Smoke test the wheel in a clean venv
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install python/dist/*.whl
          /tmp/venv/bin/python -c "import mqs.compat.botpy as shim; print(shim.patch)"
      - uses: actions/upload-artifact@v4
        with:
          name: mqs-compat-dist
          path: python/dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.dry_run == 'false'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mqs-compat-dist
          path: dist
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
